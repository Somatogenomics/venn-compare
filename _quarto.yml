project:
  type: website
  output-dir: _site

website:
  title: "VennCompare"
  site-url: "https://somatogenomics.github.io/venn-compare/"
  description: "Free browser-based Venn diagram and UpSet plot tool for comparing 2-7 gene lists or any sets, with Fisher's exact and hypergeometric overlap p-values, BH-FDR, set algebra and reproducible R code. No data leaves the browser."
  open-graph: true
  twitter-card: true

format:
  html:
    theme: flatly
